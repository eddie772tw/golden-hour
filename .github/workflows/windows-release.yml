name: Windows x64 portable release
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python packaging/build_windows.py
      - run: python -m pip install playwright
      - run: python packaging/check_windows.py dist
      - uses: actions/upload-artifact@v4
        with:
          name: golden-hour-windows-x64
          path: |
            dist/*.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error

  attach:
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: golden-hour-windows-x64
          path: dist
      - name: Attach tested archives to the published release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ github.event.release.id }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          cd dist
          sha256sum -c SHA256SUMS.txt
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets" > "$RUNNER_TEMP/assets.json"
          for file in *.zip SHA256SUMS.txt; do
            existing=$(jq -r --arg name "$file" '.[][] | select(.name == $name) | (.digest // "unknown")' "$RUNNER_TEMP/assets.json")
            expected="sha256:$(sha256sum "$file" | cut -d' ' -f1)"
            if [[ -z "$existing" ]]; then
              gh release upload "$TAG" "$file" --repo "$GITHUB_REPOSITORY"
            elif [[ "$existing" != "$expected" ]]; then
              echo "Existing release asset differs: $file" >&2
              exit 1
            fi
          done
